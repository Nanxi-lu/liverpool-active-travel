<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-label="Direct before and after peak comparison for scheme 12e">
<style>text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#111827}.title{font-size:17px;font-weight:700}.subtitle{font-size:12px;fill:#4b5563}.label{font-size:12px}.small{font-size:11px;fill:#6b7280}.grid{stroke:#e5e7eb;stroke-width:1}</style>
<text x="24" y="30" class="title">Scheme 12e: Park Road / Path off Park Road</text>
<text x="24" y="52" class="subtitle">Direct comparison of pre-peak and post-peak weekly averages for treated countlines.</text>
